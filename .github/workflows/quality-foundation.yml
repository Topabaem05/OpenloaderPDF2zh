name: Quality Foundation

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint quality foundation
        run: >-
          python -m ruff check
          src/openpdf2zh/config.py
          src/openpdf2zh/document
          src/openpdf2zh/translation
          src/openpdf2zh/pipeline.py
          src/openpdf2zh/providers/base.py
          src/openpdf2zh/providers/ctranslate2.py
          src/openpdf2zh/providers/openrouter.py
          src/openpdf2zh/services/context_translation_service.py
          src/openpdf2zh/services/document_builder.py
          src/openpdf2zh/services/pdf_structure_service.py
          src/openpdf2zh/services/parser_service.py
          src/openpdf2zh/services/protection_service.py
          src/openpdf2zh/services/redaction_service.py
          src/openpdf2zh/services/safe_render_service.py
          tests/helpers
          tests/test_document_ir.py
          tests/test_document_builder.py
          tests/test_pdf_structure_service.py
          tests/test_pdf_quality_regression.py
          tests/test_parser_service.py
          tests/test_protection_service.py
          tests/test_redaction_service.py
          tests/test_safe_render_service.py
          tests/test_translation_context.py
          tests/test_context_translation_service.py
          tests/test_translation_cache.py
          tests/test_glossary.py
          tests/test_glossary_config.py
          tests/test_base_translator_batch.py
          tests/test_ctranslate2_provider.py
          tests/test_openrouter_context.py
          tools/quality

      - name: Test
        run: python -m pytest -q
